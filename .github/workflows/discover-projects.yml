name: 自动发现 GitHub 灵感项目

on:
  schedule:
    - cron: "0 9 * * 2,5"
      timezone: "Asia/Shanghai"
  workflow_dispatch:
    inputs:
      ai_analysis_limit:
        description: "本轮最多让 AI 深读多少个仓库（1-50）"
        required: false
        default: "12"
        type: string
      max_candidates:
        description: "本轮最多生成多少个候选项目（1-20）"
        required: false
        default: "8"
        type: string

concurrency:
  group: github-inspiration-discovery
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  discover-and-draft:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DISCOVERY_AI_ANALYSIS_LIMIT: ${{ inputs.ai_analysis_limit }}
      DISCOVERY_MAX_CANDIDATES: ${{ inputs.max_candidates }}

    steps:
      - name: 读取项目
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 准备 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 准备 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: 安装网页依赖
        run: npm ci

      - name: 检查必要密钥
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "缺少 OPENAI_API_KEY。请在仓库 Settings → Secrets and variables → Actions 中添加。" >&2
            exit 2
          fi

      - name: 搜索并筛选 GitHub 仓库
        run: python skills/github-inspiration-editor/scripts/discover_repositories.py --write

      - name: AI 深读并生成候选批次
        id: drafts
        run: |
          python skills/github-inspiration-editor/scripts/generate_discovery_drafts.py --write > outputs/discovery/draft-result.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          result = json.loads(Path("outputs/discovery/draft-result.json").read_text(encoding="utf-8"))
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"batch_id={result['batchId']}\n")
              output.write(f"batch_path={result['batchPath']}\n")
              output.write(f"candidate_count={result['candidateCount']}\n")
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text(result["preview"], encoding="utf-8")
          PY

      - name: 运行自动化测试
        run: |
          python skills/github-inspiration-editor/scripts/test_repository_discovery.py
          python skills/github-inspiration-editor/scripts/test_discovery_drafts.py
          python skills/github-inspiration-editor/scripts/test_discovery_batch_publication.py
          npm run test:visual-identity
          npm run test:identity-renderer
          npm run lint
          npm run build

      - name: 创建候选审核分支
        if: steps.drafts.outputs.candidate_count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BATCH_ID: ${{ steps.drafts.outputs.batch_id }}
          BATCH_PATH: ${{ steps.drafts.outputs.batch_path }}
          CANDIDATE_COUNT: ${{ steps.drafts.outputs.candidate_count }}
        run: |
          branch="automation/discovery-${BATCH_ID}"
          git config user.name "github-inspiration-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add outputs/discovery "$BATCH_PATH"
          git commit -m "Add automated discovery batch ${BATCH_ID}"
          git push --set-upstream origin "$branch"

          body_file="${RUNNER_TEMP}/discovery-pr.md"
          printf '%s\n' \
            "## 自动候选批次 ${BATCH_ID}" \
            "" \
            "本批共有 ${CANDIDATE_COUNT} 个候选。请先查看 \`${BATCH_PATH}/preview.md\`。" \
            "" \
            "- 合并此 PR：表示你批准整批候选进入灵感流。" \
            "- 关闭此 PR：表示拒绝整批，不会修改正式页面。" \
            "- 不要直接修改候选文件；内容变化后必须重新生成指纹。" \
            "" \
            "<!-- discovery-batch:${BATCH_ID} -->" > "$body_file"

          gh pr create \
            --base main \
            --head "$branch" \
            --title "自动候选：${BATCH_ID}（${CANDIDATE_COUNT} 个项目）" \
            --body-file "$body_file"
