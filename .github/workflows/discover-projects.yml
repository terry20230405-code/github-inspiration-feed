name: 自动发现 GitHub 灵感项目

on:
  schedule:
    - cron: "0 9 * * 2,5"
      timezone: "Asia/Shanghai"
  workflow_dispatch:
    inputs:
      ai_analysis_limit:
        description: "本轮最多让 AI 深读多少个仓库（1-50）"
        required: false
        default: "12"
        type: string
      max_candidates:
        description: "本轮最多生成多少个候选项目（1-20）"
        required: false
        default: "8"
        type: string

concurrency:
  group: github-inspiration-main-writes
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  discover-and-draft:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      AI_API_BASE_URL: ${{ vars.AI_API_BASE_URL }}
      AI_MODEL: ${{ vars.AI_MODEL }}
      DISCOVERY_AI_ANALYSIS_LIMIT: ${{ inputs.ai_analysis_limit }}
      DISCOVERY_MAX_CANDIDATES: ${{ inputs.max_candidates }}

    steps:
      - name: 读取项目
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 准备 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 准备 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: 安装网页依赖
        run: npm ci

      - name: 检查必要密钥
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "缺少 OPENAI_API_KEY。请在仓库 Settings → Secrets and variables → Actions 中添加。" >&2
            exit 2
          fi

      - name: 安全巡检已发布项目
        id: published_refresh
        run: |
          set +e
          python skills/github-inspiration-editor/scripts/run_refresh_cycle.py --write
          refresh_exit_code=$?
          set -e
          echo "exit_code=${refresh_exit_code}" >> "$GITHUB_OUTPUT"

      - name: 汇总旧项目巡检结果
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report_path = Path("outputs/automation/latest.json")
          summary_path = Path(os.environ["GITHUB_STEP_SUMMARY"])
          if not report_path.exists():
              with summary_path.open("a", encoding="utf-8") as output:
                  output.write("## 旧项目巡检\n\n未生成巡检报告，请查看工作流日志。\n")
              raise SystemExit(0)

          report = json.loads(report_path.read_text(encoding="utf-8"))
          stage_six = report.get("stageSix") or {}
          stage_seven = report.get("stageSeven") or {}
          metadata = stage_six.get("summary") or {}
          sources = stage_seven.get("summary") or {}
          lines = [
              "## 旧项目巡检",
              "",
              f"- 总体状态：{report.get('status', 'unknown')}",
              f"- 已检查旧项目：{metadata.get('checked', 0)}",
              f"- 仓库数字或元数据已更新：{metadata.get('updated', 0)}",
              f"- 无实质变化：{metadata.get('refreshed', 0)}",
              f"- 建议深查 README / Release：{metadata.get('researchRefreshRecommended', 0)}",
              f"- 等待语义复审：{sources.get('semanticReviewPending', 0)}",
              f"- 需要人工决定：{metadata.get('reviewRequired', 0) + sources.get('humanDecisionRequired', 0)}",
              f"- 技术失败：{metadata.get('failed', 0) + sources.get('failed', 0)}",
              f"- 下一位处理者：{report.get('nextActor', 'unknown')}",
              f"- 下一步：{report.get('nextAction', 'unknown')}",
              "",
              "Star、Fork、pushedAt 等安全快照可自动写入；中文介绍、改造方向和视觉身份不会被本步骤修改。",
              "",
          ]
          with summary_path.open("a", encoding="utf-8") as output:
              output.write("\n".join(lines))
          PY

      - name: 保存旧项目巡检审计
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: published-refresh-audit-${{ github.run_id }}
          path: |
            outputs/automation/latest.json
            outputs/automation/runs
            outputs/refresh
            outputs/generated/research-refresh/*.source.json
            outputs/versions/snapshots
            outputs/versions/transactions
          if-no-files-found: warn
          retention-days: 30

      - name: 提交安全的旧项目刷新结果
        if: steps.published_refresh.outputs.exit_code == '0'
        run: |
          git config user.name "github-inspiration-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- \
            src/data/repositories.json \
            outputs/refresh \
            outputs/generated/research-refresh
          if git diff --cached --quiet; then
            echo "旧项目没有需要提交的安全变化。"
          else
            git commit -m "Refresh published repository snapshots"
            git push origin HEAD:main
          fi

      - name: 搜索并筛选 GitHub 仓库
        run: python skills/github-inspiration-editor/scripts/discover_repositories.py --write

      - name: AI 深读并生成候选批次
        id: drafts
        run: |
          python skills/github-inspiration-editor/scripts/generate_discovery_drafts.py --write > outputs/discovery/draft-result.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          result = json.loads(Path("outputs/discovery/draft-result.json").read_text(encoding="utf-8"))
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"batch_id={result['batchId']}\n")
              output.write(f"batch_path={result['batchPath']}\n")
              output.write(f"candidate_count={result['candidateCount']}\n")
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text(result["preview"], encoding="utf-8")
          PY

      - name: 保存本轮发现审计报告
        uses: actions/upload-artifact@v7
        with:
          name: discovery-audit-${{ github.run_id }}
          path: |
            outputs/discovery/draft-result.json
            outputs/discovery/latest.json
            outputs/discovery/latest.md
          if-no-files-found: error
          retention-days: 30

      - name: 运行自动化测试
        run: |
          python skills/github-inspiration-editor/scripts/test_repository_discovery.py
          python skills/github-inspiration-editor/scripts/test_discovery_drafts.py
          python skills/github-inspiration-editor/scripts/test_discovery_batch_publication.py
          npm run test:feed-data
          npm run test:feed-window
          npm run test:visual-identity
          npm run test:identity-renderer
          npm run lint
          npm run build

      - name: 创建候选审核分支
        if: steps.drafts.outputs.candidate_count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BATCH_ID: ${{ steps.drafts.outputs.batch_id }}
          BATCH_PATH: ${{ steps.drafts.outputs.batch_path }}
          CANDIDATE_COUNT: ${{ steps.drafts.outputs.candidate_count }}
        run: |
          branch="automation/discovery-${BATCH_ID}"
          git config user.name "github-inspiration-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add outputs/discovery "$BATCH_PATH"
          git commit -m "Add automated discovery batch ${BATCH_ID}"
          git push --set-upstream origin "$branch"

          body_file="${RUNNER_TEMP}/discovery-pr.md"
          printf '%s\n' \
            "## 自动候选批次 ${BATCH_ID}" \
            "" \
            "本批共有 ${CANDIDATE_COUNT} 个候选。请先查看 \`${BATCH_PATH}/preview.md\`。" \
            "" \
            "- 合并此 PR：表示你批准整批候选进入灵感流。" \
            "- 关闭此 PR：表示拒绝整批，不会修改正式页面。" \
            "- 不要直接修改候选文件；内容变化后必须重新生成指纹。" \
            "" \
            "<!-- discovery-batch:${BATCH_ID} -->" > "$body_file"

          gh pr create \
            --base main \
            --head "$branch" \
            --title "自动候选：${BATCH_ID}（${CANDIDATE_COUNT} 个项目）" \
            --body-file "$body_file"

      - name: 确认旧项目巡检状态
        if: always()
        env:
          REFRESH_EXIT_CODE: ${{ steps.published_refresh.outputs.exit_code }}
        run: |
          case "$REFRESH_EXIT_CODE" in
            0)
              echo "旧项目巡检完成。"
              ;;
            2)
              echo "旧项目巡检发现仓库身份、许可证或状态等关键变化，需要人工确认。" >&2
              exit 2
              ;;
            *)
              echo "旧项目巡检发生技术失败，请查看 published-refresh-audit。" >&2
              exit 1
              ;;
          esac
